name: Deploy to Production

# main -> image in ECR -> new revision of the one Asset Management task
# (web app, backend, worker, Redis) -> rolling update on ECS. GitHub signs in
# to AWS with a short-lived role (OIDC); no AWS keys are stored here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  REPOSITORY: dgx-production-asset-backend
  CONTAINERS: backend,worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::746393610736:role/dgx-production-asset-deploy
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/$REPOSITORY:${GITHUB_SHA::7}
          docker build --target production -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Roll the service onto it
        run: |
          aws ecs describe-task-definition --task-definition dgx-production-asset --query taskDefinition > td.json
          python3 - <<'EOF'
          import json, os
          t = json.load(open("td.json"))
          for k in ("taskDefinitionArn", "revision", "status", "requiresAttributes", "compatibilities", "registeredAt", "registeredBy", "deregisteredAt"):
              t.pop(k, None)
          for c in t["containerDefinitions"]:
              if c["name"] in os.environ["CONTAINERS"].split(","):
                  c["image"] = os.environ["IMAGE"]
          json.dump(t, open("td.json", "w"))
          EOF
          ARN=$(aws ecs register-task-definition --cli-input-json file://td.json --query taskDefinition.taskDefinitionArn --output text)
          aws ecs update-service --cluster dgx-production-cluster --service dgx-production-asset --task-definition "$ARN" > /dev/null
          echo "Rolling onto $ARN"
          aws ecs wait services-stable --cluster dgx-production-cluster --services dgx-production-asset
