name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/digix/backend
            git fetch origin main
            git reset --hard origin/main

            cd /opt/digix
            docker compose --env-file .env build backend celery
            docker compose --env-file .env up -d backend celery
            docker compose --env-file .env exec -T backend python manage.py migrate --noinput
            docker compose --env-file .env exec -T backend python manage.py collectstatic --noinput

            echo "Backend deployed successfully!"
