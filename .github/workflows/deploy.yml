name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/digix/backend

            # Pull latest code
            git fetch origin main
            git reset --hard origin/main

            # Rebuild and restart
            cd /opt/digix
            docker compose -f docker-compose.prod.yml --env-file .env.prod build backend celery
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d backend celery

            # Run migrations
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T backend python manage.py migrate --noinput

            # Collect static files
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T backend python manage.py collectstatic --noinput

            echo "Backend deployed successfully!"
